name: Build WinLaunchOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Build inside a real Debian bookworm container so live-build matches the target.
    container:
      image: debian:bookworm
      options: --privileged
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools rsync wget curl \
            ca-certificates git nodejs npm sudo procps

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WinLaunch (Linux)
        run: |
          cd app
          npm install
          npx @electron/packager . WinLaunch --platform=linux --arch=x64 --out=out --overwrite --asar
          mkdir -p ../config/includes.chroot/opt/winlaunch
          cp -r out/WinLaunch-linux-x64/. ../config/includes.chroot/opt/winlaunch/

      - name: Set permissions
        run: |
          chmod +x config/hooks/live/*.hook.chroot || true
          chmod +x config/includes.chroot/opt/winlaunch/*.sh || true
          chmod +x config/includes.chroot/opt/winlaunch/WinLaunch || true

      - name: Build ISO
        run: |
          sh auto/config
          lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: WinLaunchOS-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
